# Render Blueprint: one free web service that serves both the API and the React build.
services:
  - type: web
    name: github-automation-bot
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production also applies at build time, and without this flag
    # npm would skip devDependencies (typescript, vite, prisma) and the build would fail.
    # Migrations run at build time, not on start, to keep cold starts fast (GitHub gives webhooks only 10s).
    buildCommand: npm ci --include=dev && npm run build && npm run db:deploy -w server
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Secrets: sync false means Render asks for the value in its dashboard; it is never stored in this file.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_PRIVATE_KEY_BASE64
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
